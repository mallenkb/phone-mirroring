name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: |
          swift test \
            --skip 'ADBDeviceParsingTests/testManualWirelessPairingPairsThenConnectsAndMirrors' \
            --skip 'ADBDeviceParsingTests/testPresenceOfFreshWirelessADBDeviceCreatesRememberedPhone' \
            --skip 'MirrorWindowChromeTests/testBlankNativeMirrorStartsAtInitialScreenHeightRatio' \
            --skip 'MirrorWindowChromeTests/testBlankNativeMirrorUsesDefaultPhoneAspectBeforeStreamHeader' \
            --skip 'MirrorWindowChromeTests/testNativeMirrorLaunchFramePreservesDraggedCenterWhenStreamLoads'

      - name: Build App Store wrapper
        run: |
          xcodebuild \
            -project App/PhoneRelay.xcodeproj \
            -scheme PhoneRelayApp \
            -configuration Release \
            -derivedDataPath .build/XcodeDerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            build

      - name: Verify Xcode release artifact
        run: |
          APP=".build/XcodeDerivedData/Build/Products/Release/PhoneRelay.app"
          scripts/verify_release_artifact.sh "$APP"

      # Catches packaging regressions (missing scrcpy-server, renamed resource
      # bundle, broken codesign invocations) that swift test can't see.
      - name: Package app (release dry run)
        run: scripts/package_app.sh
