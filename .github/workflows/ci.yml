name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "16.4"

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: |
          swift test \
            --skip 'ADBDeviceParsingTests/testManualWirelessPairingPairsThenConnectsAndMirrors' \
            --skip 'ADBDeviceParsingTests/testPresenceOfFreshWirelessADBDeviceCreatesRememberedPhone' \
            --skip 'MirrorWindowChromeTests/testBlankNativeMirrorStartsAtInitialScreenHeightRatio' \
            --skip 'MirrorWindowChromeTests/testBlankNativeMirrorUsesDefaultPhoneAspectBeforeStreamHeader' \
            --skip 'MirrorWindowChromeTests/testNativeMirrorLaunchFramePreservesDraggedCenterWhenStreamLoads'

      - name: Build App Store wrapper
        run: |
          xcodebuild \
            -project App/PhoneRelay.xcodeproj \
            -scheme PhoneRelayApp \
            -configuration Release \
            -derivedDataPath .build/XcodeDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            build

      # CI has no distribution provisioning profile. Sign the already-built
      # bundle ad hoc so the same strict artifact verifier can still inspect
      # entitlements, nested code, and helper/resource integrity.
      - name: Ad-hoc sign Xcode release artifact
        run: |
          APP=".build/XcodeDerivedData/Build/Products/Release/PhoneRelay.app"
          codesign --force --deep --options runtime --sign - "$APP"
          codesign \
            --force \
            --options runtime \
            --entitlements scripts/PhoneRelay.release.entitlements \
            --sign - \
            "$APP"

      - name: Verify Xcode release artifact
        run: |
          APP=".build/XcodeDerivedData/Build/Products/Release/PhoneRelay.app"
          scripts/verify_release_artifact.sh "$APP"

      # Catches packaging regressions (missing scrcpy-server, renamed resource
      # bundle, broken codesign invocations) that swift test can't see.
      - name: Package app (release dry run)
        run: scripts/package_app.sh

  swift-6-compatibility:
    name: Swift 6 Compatibility (non-blocking)
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "16.4"

      - name: Build in Swift 6 language mode
        # PostHog currently bounds this lane below green. Keeping the build
        # visible but non-blocking lets us catch changes in that dependency and
        # prevents new project-owned Swift 6 errors from accumulating unnoticed.
        run: swift build -Xswiftc -swift-version -Xswiftc 6
