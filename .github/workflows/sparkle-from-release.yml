name: Publish Sparkle Assets From Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.20."
        required: true
        type: string

permissions:
  contents: read

jobs:
  sparkle:
    name: Generate Sparkle ZIP and appcast
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      dmg_name: ${{ steps.version.outputs.dmg_name }}
      zip_name: ${{ steps.version.outputs.zip_name }}
    env:
      WEBSITE_REPO: mallenkb/phonerelay-website
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "16.4"

      - name: Validate tag
        id: version
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match vX.Y.Z; got $TAG" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg_name=PhoneRelay-$VERSION.dmg" >> "$GITHUB_OUTPUT"
          echo "zip_name=PhoneRelay-$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Download release DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${{ steps.version.outputs.tag }}" \
            --pattern "${{ steps.version.outputs.dmg_name }}" \
            --dir dist \
            --clobber
          test -f "dist/${{ steps.version.outputs.dmg_name }}"

      - name: Extract app from DMG
        run: |
          set -euo pipefail
          MOUNT_DIR="$(mktemp -d)"
          hdiutil attach "dist/${{ steps.version.outputs.dmg_name }}" -nobrowse -mountpoint "$MOUNT_DIR"
          APP_PATH="$(find "$MOUNT_DIR" -maxdepth 1 -name '*.app' -type d | head -1)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found in DMG." >&2
            hdiutil detach "$MOUNT_DIR" || true
            exit 1
          fi
          rm -rf dist/PhoneRelay.app
          ditto "$APP_PATH" dist/PhoneRelay.app
          hdiutil detach "$MOUNT_DIR"
          rmdir "$MOUNT_DIR"

      - name: Verify extracted app
        run: |
          set -euo pipefail
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/PhoneRelay.app/Contents/Info.plist)"
          if [ "$APP_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "App version $APP_VERSION does not match ${{ steps.version.outputs.tag }}" >&2
            exit 1
          fi
          scripts/verify_release_artifact.sh dist/PhoneRelay.app
          xcrun stapler validate dist/PhoneRelay.app

      - name: Resolve Sparkle tools
        run: |
          set -euo pipefail
          SPARKLE_VERSION="2.9.3"
          SPARKLE_SHA256="3a5d7fd698acc39c122e75764ed3614b472b284cc483f32ae7006d86c513370c"
          SPARKLE_URL="https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-for-Swift-Package-Manager.zip"
          SPARKLE_ARCHIVE="$RUNNER_TEMP/Sparkle-${SPARKLE_VERSION}.zip"
          mkdir -p .build/artifacts/sparkle/Sparkle
          curl --fail --location --retry 3 --output "$SPARKLE_ARCHIVE" "$SPARKLE_URL"
          printf '%s  %s\n' "$SPARKLE_SHA256" "$SPARKLE_ARCHIVE" | shasum -a 256 -c -
          unzip -q -o "$SPARKLE_ARCHIVE" -d .build/artifacts/sparkle/Sparkle
          test -x .build/artifacts/sparkle/Sparkle/bin/generate_appcast

      - name: Create Sparkle ZIP and appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          SPARKLE_DOWNLOAD_URL_PREFIX: https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/
          SPARKLE_RELEASE_LINK: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          : "${SPARKLE_PRIVATE_KEY:?Missing SPARKLE_PRIVATE_ED_KEY secret.}"
          scripts/make_sparkle_update.sh dist/PhoneRelay.app

      - name: Verify Sparkle appcast
        run: |
          set -euo pipefail
          test -f "dist/sparkle/${{ steps.version.outputs.zip_name }}"
          test -f dist/sparkle/appcast.xml
          grep -q "${{ steps.version.outputs.zip_name }}" dist/sparkle/appcast.xml
          grep -q 'sparkle:edSignature=' dist/sparkle/appcast.xml

      - name: Stage signed Sparkle assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sparkle-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/sparkle/${{ steps.version.outputs.zip_name }}
            dist/sparkle/appcast.xml
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified Sparkle assets
    needs: sparkle
    runs-on: macos-15
    permissions:
      contents: write
    env:
      WEBSITE_REPO: mallenkb/phonerelay-website
    steps:
      - name: Download signed Sparkle assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkle-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/sparkle

      - name: Verify staged Sparkle assets
        run: |
          set -euo pipefail
          test -f "dist/sparkle/${{ needs.sparkle.outputs.zip_name }}"
          test -f dist/sparkle/appcast.xml
          grep -q "${{ needs.sparkle.outputs.zip_name }}" dist/sparkle/appcast.xml
          grep -q 'sparkle:edSignature=' dist/sparkle/appcast.xml

      - name: Upload Sparkle release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ needs.sparkle.outputs.tag }}" \
            "dist/sparkle/${{ needs.sparkle.outputs.zip_name }}" \
            dist/sparkle/appcast.xml \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Dispatch website update
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?Missing WEBSITE_REPO_TOKEN secret}"
          gh workflow run update-download.yml \
            --repo "$WEBSITE_REPO" \
            --ref main \
            -f version="${{ needs.sparkle.outputs.version }}" \
            -f tag="${{ needs.sparkle.outputs.tag }}" \
            -f download_url="https://github.com/${{ github.repository }}/releases/download/${{ needs.sparkle.outputs.tag }}/${{ needs.sparkle.outputs.dmg_name }}"
