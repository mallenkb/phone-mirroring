name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Write latest release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/releases/latest" \
            --jq '{
              tag_name: .tag_name,
              name: .name,
              html_url: .html_url,
              published_at: .published_at,
              assets: [.assets[] | {
                name: .name,
                size: .size,
                browser_download_url: .browser_download_url
              }]
            }' > docs/release.json; then
            echo "Wrote release metadata from GitHub Releases."
          else
            echo "No latest release found; keeping committed docs/release.json fallback." >&2
          fi
          cat docs/release.json

      - name: Write latest Sparkle appcast
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release download --repo "$REPO" --pattern appcast.xml --output docs/appcast.xml --clobber; then
            echo "Wrote Sparkle appcast from latest GitHub Release."
          else
            echo "No appcast release asset found; keeping committed docs/appcast.xml fallback." >&2
          fi
          test -f docs/appcast.xml

      - name: Upload static site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
